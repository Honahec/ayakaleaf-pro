# These static hostPath PVs live on the Btrfs-backed /var/lib, not the default
# local-path StorageClass (/zdata/data). Capacities are declarations, not quotas.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ayakaleaf-pro-app
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/ayakaleaf-pro/app
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [andromeda]
---
