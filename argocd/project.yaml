apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ayakaleaf-pro
  namespace: argocd
spec:
  description: Ayakaleaf Pro deployment on Andromeda
  sourceRepos:
    - https://github.com/Honahec/ayakaleaf-pro.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ayakaleaf-pro
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: ''
      kind: PersistentVolume
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: Pod
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: networking.k8s.io
      kind: Ingress
