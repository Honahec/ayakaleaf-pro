name: Verify Andromeda Deployment

on:
  push:
    branches: [server-pro]
    paths:
      - 'deploy/**'
      - '.github/workflows/verify_deployment.yml'
      - '.github/scripts/smoke-deployment.sh'
  pull_request:
    branches: [server-pro]
    paths:
      - 'deploy/**'
      - '.github/workflows/verify_deployment.yml'
      - '.github/scripts/smoke-deployment.sh'
  workflow_dispatch:
    inputs:
      image:
        description: 'Optional full application image reference with SHA256 digest'
        type: string
        required: false
  workflow_call:
    inputs:
      image:
        description: 'Full application image reference with SHA256 digest'
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install disposable cluster tooling
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.30.14/bin/linux/amd64/kubectl.sha256 --output "$RUNNER_TEMP/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/kubectl.sha256")" "$RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
      - name: Exercise Kubernetes startup, DinD compilation and persistence
        env:
          IMAGE_REFERENCE: ${{ inputs.image }}
        run: bash .github/scripts/smoke-deployment.sh
