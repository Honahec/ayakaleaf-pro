# ---------------------------------
# This workflow is used to build overleaf image automatically
#
# Published at:
#     ghcr.io/<repository-owner>/<repository-name>
#
# ---------------------------------

name: Build Operations Image
on:
  push:
    branches:
      - server-pro
    paths-ignore:
      - 'argocd/**'
      - '**/*.md'
  pull_request:
    branches:
      - server-pro
    paths-ignore:
      - 'argocd/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Build without cache"
        type: boolean
        default: false
env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # The build only reads source; the separate writeback job has the write token.
  build-image:
    permissions:
      contents: read
      packages: write
    outputs:
      published_digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-24.04
    steps:
      # If the event is a pull request, checkout the head sha of the PR
      - name: "Checkout Current Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve image repository
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: "Login to GitHub Container Registry"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{env.DOCKER_REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      # --- We need to sync yarn.lock/i18 to ensure consistency ---
      - name: "Sync yarn.lock And Prepare .dockerignore"
        run: |
          docker run --rm -v "$(pwd)":/workspace -w /workspace node:24.18.1 sh -c "corepack enable && yarn install --mode=update-lockfile"
          # Apply the highest-versioned locale patch over the base locales before extracting
          patch_dir=$(printf '%s\n' services/web/locales/locales_patches/v*/ | sort -V | tail -n1)
          if [ -d "$patch_dir" ]; then
            echo "Applying locale patch: $patch_dir"
            cp "$patch_dir"*.json services/web/locales/
          else
            echo "No locale patch directory found; skipping"
          fi
          docker run --rm -v "$(pwd)/services/web/":/overleaf/services/web -w /overleaf/services/web ghcr.io/ayaka-notes/overleaf-pro/dev:webpack yarn run extract-translations
          cd ./server-ce/
          cp .dockerignore ../

      # --- Set up Docker ---
      # See: https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Set up Docker (enable containerd image store)
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Buildx (docker driver)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # --- Build Base Image ---
      - name: "Build base image (hash cache)"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile-base
          load: true
          push: false
          pull: true
          tags: |
            overleaf-pro-base:ci
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          cache-to: type=gha,mode=max,scope=base-${{ hashFiles('server-ce/Dockerfile-base') }}
          provenance: false
          sbom: false
      # --- End of Base Image ---
      
      # --- Build Server Image ---
      - name: "Get MONOREPO_REVISION"
        id: vars
        run: echo "MONOREPO_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: "Build Server image"
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./server-ce/Dockerfile
          load: true
          push: false
          pull: false
          build-args: |
            OVERLEAF_BASE_TAG=overleaf-pro-base:ci
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.MONOREPO_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.MONOREPO_REVISION }}
          # We don't want -${{ github.ref_name }} limit, just more cache hit
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
          provenance: false
          sbom: false
      # --- End of Server Image ---

      - name: Smoke test sandboxed compilation
        env:
          IMAGE: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.MONOREPO_REVISION }}
        run: |
          printf 'FROM overleaf-pro-base:ci\nENTRYPOINT []\n' | docker build --tag ayakaleaf-tex-smoke:ci -
          compile_root=$(mktemp -d "$RUNNER_TEMP/compile-smoke.XXXXXX")
          trap 'sudo rm -rf "$compile_root"' EXIT
          mkdir "$compile_root/ci-smoke"
          printf '%s\n' '\documentclass{article}\begin{document}Sandbox compile smoke test.\end{document}' > "$compile_root/ci-smoke/main.tex"
          sudo chown -R 33:33 "$compile_root"
          socket=$(docker context inspect --format '{{.Endpoints.docker.Host}}')
          socket=${socket#unix://}
          docker run --rm -i --user www-data --group-add "$(stat -c '%g' "$socket")" \
            --entrypoint node --workdir /overleaf/services/clsi \
            -v "$socket:/var/run/docker.sock" \
            -v "$compile_root:/var/lib/overleaf/data/compiles" \
            -e SANDBOXED_COMPILES=true \
            -e SANDBOXED_COMPILES_HOST_DIR_COMPILES="$compile_root" \
            -e TEXLIVE_IMAGE=ayakaleaf-tex-smoke:ci -e TEXLIVE_IMAGE_USER=www-data \
            "$IMAGE" --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import runner from './app/js/CommandRunner.js'
          let container
          try {
            const result = await new Promise((resolve, reject) => {
              container = runner.run(
                'ci-smoke', ['pdflatex', '-interaction=nonstopmode', '-halt-on-error', 'main.tex'],
                '/var/lib/overleaf/data/compiles/ci-smoke', null, 30000, {}, 'standard', undefined,
                (error, output) => error ? reject(error) : resolve(output)
              )
            })
            assert.equal(result.exitCode, 0, result.stdout + result.stderr)
            const pdf = await readFile('/var/lib/overleaf/data/compiles/ci-smoke/main.pdf')
            assert.equal(pdf.subarray(0, 5).toString(), '%PDF-')
            console.log('Sandboxed DockerRunner compilation produced a PDF successfully')
          } finally {
            runner.stopContainerMonitor()
            if (container) {
              await new Promise((resolve, reject) => runner.destroyContainer(
                container, null, true, error => error ? reject(error) : resolve()
              ))
            }
          }
          NODE

      - name: Publish deployment image
        id: publish
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ steps.vars.outputs.MONOREPO_REVISION }}
        run: |
          image="$DOCKER_REGISTRY/$IMAGE_NAME"
          tag="sha-$REVISION"
          docker push "$image:$tag"
          if [ "$GITHUB_REF" = refs/heads/server-pro ]; then
            docker tag "$image:$tag" "$image:latest"
            docker push "$image:latest"
          fi
          digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
          if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected published image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf "## Deployment image\n\nTag: \`%s:%s\`\n\nArgo CD image: \`%s@%s\`\n" "$image" "$tag" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  update-deployment-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/server-pro' && github.repository == 'Honahec/ayakaleaf-pro'
    needs: build-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: server-pro-andromeda-image-writeback
      cancel-in-progress: false
    steps:
      - name: Checkout clean deployment source
        uses: actions/checkout@v7
        with:
          ref: server-pro
          fetch-depth: 0
      - name: Update image digest if source remains current
        env:
          BUILT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.published_digest }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BUILT_SHA" HEAD -- . ':(exclude)argocd/**' ':(exclude,glob)**/*.md'; then
            echo 'Source changed since this build; leaving the deployment image unchanged.'
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('argocd/kustomization.yaml')
          updated, count = re.subn(r'(?m)^    digest: sha256:[a-f0-9]{64}$',
              f"    digest: {os.environ['IMAGE_DIGEST']}", path.read_text())
          assert count == 1, 'Expected one pinned application image digest'
          path.write_text(updated)
          PY
          git diff --quiet -- argocd/kustomization.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argocd/kustomization.yaml
          git commit -m "chore(deploy): pin ayakaleaf-pro image to $IMAGE_DIGEST"
          git push origin HEAD:refs/heads/server-pro
